# ============================================================================
# LVL-CODES: Forecasting Models Configuration
# ============================================================================
# This file contains hyperparameters and settings for all forecasting models
# used in the 2026 sales target management system.
#
# Models included:
#   - SARIMA (Seasonal AutoRegressive Integrated Moving Average)
#   - Prophet (Facebook's forecasting tool)
#   - XGBoost (Gradient Boosting)
#   - LightGBM (Light Gradient Boosting Machine)
#   - Random Forest
#   - Ensemble (combination of all models)
# ============================================================================

# ============================================================================
# GENERAL MODEL SETTINGS
# ============================================================================
general:
  # Random seed for reproducibility
  random_seed: 42

  # Cross-validation settings
  cv_folds: 5
  test_size: 0.2
  validation_size: 0.1

  # Feature engineering
  lag_periods: [1, 7, 14, 30, 365]  # Days to use for lag features
  rolling_windows: [7, 14, 30, 90]   # Rolling window sizes
  seasonal_periods: [7, 30, 365]     # Weekly, monthly, yearly

  # Parallel processing
  n_jobs: -1  # -1 uses all available CPU cores

  # Model storage
  model_save_path: ${MODEL_STORAGE_PATH:./models/saved_models/}

# ============================================================================
# SARIMA MODEL CONFIGURATION
# ============================================================================
sarima:
  enabled: true
  description: "Seasonal ARIMA for time series with trends and seasonality"

  # Auto ARIMA settings (pmdarima library)
  auto_arima:
    # Seasonal period (365 for daily data with yearly seasonality)
    seasonal: true
    m: 365  # Seasonal period

    # Search parameters
    start_p: 0      # Starting value for p (AR order)
    start_q: 0      # Starting value for q (MA order)
    max_p: 5        # Maximum p
    max_q: 5        # Maximum q
    start_P: 0      # Seasonal AR
    start_Q: 0      # Seasonal MA
    max_P: 2        # Maximum seasonal AR
    max_Q: 2        # Maximum seasonal MA
    max_d: 2        # Maximum differencing order
    max_D: 1        # Maximum seasonal differencing

    # Model selection criteria
    information_criterion: "aic"  # AIC or BIC
    trace: true                   # Print search progress
    error_action: "ignore"        # Ignore warnings
    suppress_warnings: true
    stepwise: true                # Use stepwise search (faster)

  # Forecasting parameters
  forecast:
    confidence_interval: 0.95     # 95% confidence intervals
    return_conf_int: true

# ============================================================================
# PROPHET MODEL CONFIGURATION
# ============================================================================
prophet:
  enabled: true
  description: "Facebook Prophet for forecasting with holidays and events"

  # Core parameters
  params:
    # Growth model: 'linear' or 'logistic'
    growth: "linear"

    # Changepoint settings (trend changes)
    changepoint_prior_scale: 0.05  # Flexibility of trend (higher = more flexible)
    changepoint_range: 0.8         # Proportion of history for changepoints
    n_changepoints: 25             # Number of potential changepoints

    # Seasonality settings
    yearly_seasonality: true       # Enable yearly patterns
    weekly_seasonality: true       # Enable weekly patterns
    daily_seasonality: false       # Disable daily patterns (not needed for daily aggregates)
    seasonality_mode: "multiplicative"  # 'additive' or 'multiplicative'
    seasonality_prior_scale: 10.0  # Strength of seasonality

    # Holidays and special events
    holidays_prior_scale: 10.0     # Strength of holiday effects

  # Custom seasonality
  custom_seasonality:
    - name: "monthly"
      period: 30.5
      fourier_order: 5

    - name: "quarterly"
      period: 91.25
      fourier_order: 3

  # Holidays (pet food industry specific)
  holidays:
    # Major shopping holidays
    - name: "Black Friday"
      type: "promotional"
      impact: "high"

    - name: "Cyber Monday"
      type: "promotional"
      impact: "high"

    - name: "Christmas"
      type: "seasonal"
      impact: "high"

    - name: "New Year"
      type: "seasonal"
      impact: "medium"

    # Pet-specific events
    - name: "National Pet Day"
      date: "04-11"  # April 11
      impact: "medium"

    - name: "National Dog Day"
      date: "08-26"  # August 26
      impact: "medium"

# ============================================================================
# XGBOOST MODEL CONFIGURATION
# ============================================================================
xgboost:
  enabled: true
  description: "Gradient boosting for complex non-linear patterns"

  # Hyperparameters
  params:
    # Learning parameters
    learning_rate: 0.05            # Step size shrinkage
    max_depth: 6                   # Maximum tree depth
    min_child_weight: 1            # Minimum sum of instance weight
    gamma: 0                       # Minimum loss reduction for split
    subsample: 0.8                 # Fraction of samples for tree
    colsample_bytree: 0.8          # Fraction of features for tree
    colsample_bylevel: 0.8         # Fraction of features per level

    # Regularization
    reg_alpha: 0.1                 # L1 regularization
    reg_lambda: 1.0                # L2 regularization

    # Training settings
    n_estimators: 500              # Number of boosting rounds
    early_stopping_rounds: 50      # Stop if no improvement
    eval_metric: "rmse"            # Evaluation metric

    # Other settings
    objective: "reg:squarederror"  # Regression objective
    tree_method: "auto"            # Tree construction algorithm
    random_state: 42

# ============================================================================
# LIGHTGBM MODEL CONFIGURATION
# ============================================================================
lightgbm:
  enabled: true
  description: "Light gradient boosting for fast training on large datasets"

  # Hyperparameters
  params:
    # Learning parameters
    learning_rate: 0.05
    num_leaves: 31                 # Number of leaves per tree
    max_depth: -1                  # No limit (controlled by num_leaves)
    min_data_in_leaf: 20           # Minimum samples per leaf
    min_gain_to_split: 0.0         # Minimum gain to split

    # Regularization
    lambda_l1: 0.1                 # L1 regularization
    lambda_l2: 1.0                 # L2 regularization
    feature_fraction: 0.8          # Feature sampling
    bagging_fraction: 0.8          # Data sampling
    bagging_freq: 5                # Bagging frequency

    # Training settings
    n_estimators: 500
    early_stopping_rounds: 50
    metric: "rmse"

    # Other settings
    objective: "regression"
    boosting_type: "gbdt"          # Gradient boosting decision tree
    random_state: 42
    verbose: -1                    # Suppress warnings

# ============================================================================
# RANDOM FOREST MODEL CONFIGURATION
# ============================================================================
random_forest:
  enabled: true
  description: "Random forest for robust ensemble predictions"

  # Hyperparameters
  params:
    # Tree parameters
    n_estimators: 200              # Number of trees
    max_depth: 15                  # Maximum tree depth
    min_samples_split: 10          # Minimum samples to split node
    min_samples_leaf: 5            # Minimum samples per leaf
    max_features: "sqrt"           # Number of features for split

    # Sampling
    bootstrap: true                # Bootstrap sampling
    oob_score: true                # Out-of-bag score

    # Other settings
    random_state: 42
    n_jobs: -1                     # Parallel processing
    verbose: 0

# ============================================================================
# ENSEMBLE MODEL CONFIGURATION
# ============================================================================
ensemble:
  enabled: true
  description: "Weighted combination of all models for optimal accuracy"

  # Model weights (must sum to 1.0)
  # Adjust based on validation performance
  weights:
    sarima: 0.20        # 20% weight
    prophet: 0.25       # 25% weight
    xgboost: 0.25       # 25% weight
    lightgbm: 0.20      # 20% weight
    random_forest: 0.10 # 10% weight

  # Ensemble method: 'weighted', 'stacking', 'voting'
  method: "weighted"

  # Stacking meta-learner (if method = 'stacking')
  meta_learner:
    model: "linear_regression"
    params:
      fit_intercept: true

  # Performance metrics for weight adjustment
  metrics:
    - "rmse"      # Root Mean Squared Error
    - "mae"       # Mean Absolute Error
    - "mape"      # Mean Absolute Percentage Error
    - "r2"        # R-squared
    - "smape"     # Symmetric MAPE

# ============================================================================
# FEATURE ENGINEERING
# ============================================================================
features:
  # Temporal features
  temporal:
    - "year"
    - "month"
    - "quarter"
    - "day_of_week"
    - "day_of_month"
    - "day_of_year"
    - "week_of_year"
    - "is_weekend"
    - "is_month_start"
    - "is_month_end"
    - "is_quarter_start"
    - "is_quarter_end"

  # Lag features
  lags:
    periods: [1, 7, 14, 30, 90, 365]
    columns: ["sales", "quantity", "returns"]

  # Rolling statistics
  rolling:
    windows: [7, 14, 30, 90]
    functions: ["mean", "std", "min", "max", "median"]
    columns: ["sales", "quantity"]

  # Categorical encodings
  categorical:
    method: "target_encoding"  # or "one_hot", "label_encoding"
    columns: ["category", "subgroup", "region", "channel"]

  # External factors
  external:
    - "promotions"       # Promotional activity indicator
    - "holidays"         # Holiday indicator
    - "competitor_price" # Competitor pricing (if available)
    - "weather"          # Weather data (if available)

# ============================================================================
# MODEL EVALUATION
# ============================================================================
evaluation:
  # Metrics to calculate
  metrics:
    - "rmse"
    - "mae"
    - "mape"
    - "smape"
    - "r2"
    - "mse"

  # Cross-validation strategy
  cv_strategy: "time_series_split"  # Respects temporal order
  cv_n_splits: 5

  # Backtesting
  backtest:
    enabled: true
    periods: 12          # Test last 12 months
    stride: 1            # Move forward 1 month at a time

# ============================================================================
# MODEL RETRAINING
# ============================================================================
retraining:
  # Automatic retraining schedule
  enabled: true
  frequency: "monthly"   # Retrain monthly
  min_new_data_points: 30  # Minimum new records to trigger retrain

  # Performance monitoring
  performance_threshold: 0.10  # Retrain if performance drops >10%
  drift_detection: true        # Monitor for concept drift

# ============================================================================
# EXPERIMENT TRACKING (MLflow)
# ============================================================================
mlflow:
  enabled: false  # Set to true to enable MLflow tracking
  tracking_uri: ${MLFLOW_TRACKING_URI:http://localhost:5000}
  experiment_name: ${MLFLOW_EXPERIMENT_NAME:2026_sales_targets}
  artifact_location: "./mlruns"

  # What to log
  log_params: true
  log_metrics: true
  log_models: true
  log_artifacts: true
